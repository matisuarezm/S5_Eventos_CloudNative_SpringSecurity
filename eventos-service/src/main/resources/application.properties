spring.application.name=eventos-service
server.port=${SERVER_PORT:8081}

# --- Base de datos: Oracle Cloud (Autonomous Database) ---
# Los valores llegan por variables de entorno; nunca se escriben aqui.
# DB_URL = "jdbc:oracle:thin:@" + cadena TLS copiada desde OCI (ver README, paso 1)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate crea/actualiza las tablas EVENTOS automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Eventos de ejemplo si la tabla esta vacia
app.datos-iniciales=${APP_DATOS_INICIALES:true}

# Actuator: solo health e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Semana 5: Spring Security + IDaaS (Azure AD B2C) ---
# El microservicio actua como "resource server": exige un token JWT (Authorization: Bearer ...)
# y lo valida con las claves publicas que publica el emisor (issuer).
# ISSUER_URI debe ser igual al claim "iss" del token y al emisor del autorizador JWT de API Gateway.
# Spring descarga {issuer}/.well-known/openid-configuration la primera vez que llega un token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI:https://login.microsoftonline.com/d75d5096-c9b7-46bd-bf00-5498b3a931da/v2.0}
# AUDIENCE = Id. de aplicacion (cliente) de Azure: el claim "aud" del token debe coincidir.
spring.security.oauth2.resourceserver.jwt.audiences=${AUDIENCE:4b6c5993-ccad-4a90-b661-f28831404e77}
